services:
  web:
    build:
      context: ./web
      dockerfile: ../docker/web/Dockerfile
    ports:
      - "8002:80"
    volumes:
      - ./web:/var/www/html
      - ./shared/images:/var/www/html/storage/app/public/generated
    environment:
      - APP_ENV=local
      - APP_URL=http://100.103.177.31:8002
      - APP_KEY=base64:$(php artisan key:generate --show)
      - AI_ENGINE_URL=http://ai:8000
    depends_on:
      - ai

  ai:
    build:
      context: ./ai
    ports:
      - "8082:8000"
    volumes:
      - ./ai:/app
      - ./shared/images:/app/outputs
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

networks:
  default:
    name: gen-images-network
