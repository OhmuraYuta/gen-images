[tool.poetry]
name = "ai-engine"
version = "0.1.0"
description = "Image generation engine using Stable Diffusion"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
torch = {version = "^2.1.0", source = "pytorch_gpu"}
diffusers = "^0.24.0"
transformers = "^4.35.0"
accelerate = "^0.24.0"
pillow = "^10.1.0"
python-multipart = "^0.0.6"

[[tool.poetry.source]]
name = "pytorch_gpu"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
